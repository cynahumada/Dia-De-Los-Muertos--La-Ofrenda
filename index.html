<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>La Ofrenda: A Día de los Muertos Reading Game</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Abril+Fatface&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&display=swap">
<style>
*, *::before, *::after { box-sizing: border-box; }

:root {
  color-scheme: light;
  --bg: #F4EEFA;
  --panel: #FFFFFF;
  --panel-2: #E8DDF4;
  --ink: #2A1740;
  --muted: #5C4A78;
  --accent: #B85A00;
  --accent-ink: #FFFFFF;
  --paper: #FFFFFF;
  --paper-ink: #2A1740;
  --paper-mute: #6A5A86;
  --good: #1F7A4D;
  --bad: #B3243F;
  --line: #CDBEE3;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --bg: #1E1233;
    --panel: #2B1B47;
    --panel-2: #3A2760;
    --ink: #F6EEF9;
    --muted: #C3B3D9;
    --accent: #FFB02E;
    --accent-ink: #2A1500;
    --paper: #F7F1FA;
    --paper-ink: #2A1740;
    --paper-mute: #6A5A86;
    --good: #7BE0B0;
    --bad: #FF8FA3;
    --line: #4D3A78;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #1E1233;
  --panel: #2B1B47;
  --panel-2: #3A2760;
  --ink: #F6EEF9;
  --muted: #C3B3D9;
  --accent: #FFB02E;
  --accent-ink: #2A1500;
  --paper: #F7F1FA;
  --paper-ink: #2A1740;
  --paper-mute: #6A5A86;
  --good: #7BE0B0;
  --bad: #FF8FA3;
  --line: #4D3A78;
}

html { scroll-padding-top: env(safe-area-inset-top, 0px); }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font: 18px/1.55 "Atkinson Hyperlegible", system-ui, -apple-system, "Segoe UI", sans-serif;
}
.wrap { max-width: 780px; margin: 0 auto; padding: 20px 18px 72px; }
h1, h2, h3 { font-family: "Abril Fatface", Georgia, "Times New Roman", serif; font-weight: 400; line-height: 1.1; margin: 0; }
p { margin: 0 0 12px; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }
[tabindex="-1"]:focus { outline: none; }

/* Top bar */
.top { display: flex; align-items: center; justify-content: space-between; gap: 12px 18px; flex-wrap: wrap; margin-bottom: 18px; }
.brand { font-family: "Abril Fatface", Georgia, serif; font-size: 24px; }
.pills { display: flex; gap: 6px; flex-wrap: wrap; list-style: none; margin: 0; padding: 0; }
.pill { font-size: 13px; padding: 3px 10px; border-radius: 99px; border: 1.5px solid var(--line); color: var(--muted); display: inline-flex; align-items: center; gap: 6px; }
.pill i { width: 9px; height: 9px; border-radius: 50%; border: 1.5px solid var(--muted); display: inline-block; }
.pill.on { color: var(--ink); border-color: var(--accent); }
.pill.on i { background: var(--accent); border-color: var(--accent); }
.pill.here { background: var(--panel-2); color: var(--ink); font-weight: 700; }

/* Altar */
.altarbox { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 10px 10px 4px; margin: 0 auto 18px; max-width: 460px; }
.altarbox svg { display: block; width: 100%; height: auto; }
.item { transition: opacity .5s; }
.item.off { opacity: .16; filter: grayscale(1); }
.item.new { animation: pop .8s ease-out; transform-box: fill-box; transform-origin: 50% 100%; }
@keyframes pop { 0% { transform: scale(.2); opacity: 0; } 60% { transform: scale(1.12); opacity: 1; } 100% { transform: scale(1); } }
.flame { transform-box: fill-box; transform-origin: 50% 100%; animation: flicker 2.6s infinite ease-in-out; }
@keyframes flicker { 0%, 100% { transform: scale(1, 1) rotate(-1deg); } 50% { transform: scale(.94, 1.08) rotate(1.5deg); } }
.dedcap { font-family: "Abril Fatface", Georgia, serif; font-size: 22px; text-align: center; margin: 6px 0 8px; min-height: 1px; color: var(--accent); overflow-wrap: anywhere; }

/* Start */
.hero h1 { font-size: clamp(46px, 10vw, 76px); margin: 4px 0 8px; }
.hero .tag { font-size: 20px; color: var(--muted); margin-bottom: 18px; max-width: 46ch; }
.recap { border-left: 4px solid var(--accent); padding: 4px 0 4px 16px; color: var(--muted); margin: 0 0 18px; max-width: 62ch; }
.recap b { color: var(--ink); }

/* Buttons */
.btn { font: inherit; font-weight: 700; padding: 11px 20px; border-radius: 8px; border: 2px solid var(--accent); background: var(--accent); color: var(--accent-ink); cursor: pointer; }
.btn:hover:not(:disabled) { filter: brightness(1.08); }
.btn.ghost { background: transparent; color: var(--ink); border-color: var(--line); }
.btn.ghost:hover:not(:disabled) { border-color: var(--accent); filter: none; }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.row { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; }

/* Set */
.set-head { margin-bottom: 14px; }
.set-head h2 { font-size: 36px; margin-bottom: 6px; }
.skill { color: var(--muted); margin: 0 0 10px; max-width: 62ch; }
.teks { display: flex; gap: 10px; align-items: baseline; background: var(--panel-2); border-radius: 8px; padding: 10px 14px; font-size: 16px; }
.teks b { color: var(--accent); white-space: nowrap; }
.peek { margin: 0 0 14px; }
.peek summary { cursor: pointer; font-weight: 700; color: var(--muted); }
.peek .altarbox { margin-top: 10px; max-width: 380px; margin-left: 0; }

details.passage { margin: 14px 0; border: 1px solid var(--line); border-radius: 10px; background: var(--panel); }
details.passage > summary { padding: 12px 16px; cursor: pointer; font-weight: 700; }
details.passage > summary .kind { display: block; font-weight: 400; font-size: 14px; color: var(--muted); }
details.passage .paper { margin: 0 12px 12px; }
.qmeta { display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; align-items: center; margin: 18px 0 6px; color: var(--muted); font-size: 16px; }
.velas { display: inline-flex; align-items: center; gap: 6px; }
.vela { width: 14px; height: 14px; border-radius: 50%; border: 2px solid var(--accent); display: inline-block; }
.vela.full { background: var(--accent); }

.paper { background: var(--paper); color: var(--paper-ink); border-left: 5px solid var(--accent); padding: 14px 16px 6px; margin: 12px 0 18px; border-radius: 2px 8px 8px 2px; }
.paper figcaption { font-size: 14px; font-weight: 700; color: var(--paper-mute); margin-bottom: 8px; }
.paper p { display: grid; grid-template-columns: 3.2ch 1fr; gap: 10px; margin: 0 0 10px; line-height: 1.6; }
.paper.poem p { grid-template-columns: 5.2ch 1fr; }
.pn { font-size: 13px; font-weight: 700; color: var(--paper-mute); padding-top: 3px; }
.paper p.np { display: block; }
details.passage .paper h3 { font-size: 22px; margin: 0 0 10px; }

.prompt { font-size: 20px; font-weight: 700; margin: 6px 0 4px; padding: 0; }
.hint { color: var(--muted); font-size: 16px; margin: 0 0 6px; }
.choice { display: flex; gap: 12px; align-items: flex-start; border: 1px solid var(--line); background: var(--panel); padding: 12px 14px; border-radius: 8px; margin: 8px 0; cursor: pointer; }
.choice:hover { border-color: var(--accent); }
.choice input { margin-top: 4px; accent-color: var(--accent); width: 20px; height: 20px; flex: none; }
.choice:has(input:checked) { border-color: var(--accent); background: var(--panel-2); }
.choice.out { opacity: .55; cursor: not-allowed; }
.choice.out .t { text-decoration: line-through; }
.choice.right { border-color: var(--good); border-width: 2px; }
.choice .tag { font-size: 14px; color: var(--muted); display: block; }
.choice .pn { color: var(--accent); margin-right: 6px; padding: 0; }
.choice:focus-within { outline: 3px solid var(--accent); outline-offset: 2px; }

.actions { margin-top: 16px; }
.menu { margin-top: 12px; padding: 12px 14px; border: 1px dashed var(--accent); border-radius: 8px; }
.menu p { margin: 0 0 8px; font-size: 16px; color: var(--muted); }
.clue { margin-top: 12px; padding: 10px 14px; border-radius: 8px; background: var(--panel-2); font-size: 17px; }
.clue b { color: var(--accent); }
.fb { margin-top: 16px; padding: 14px 16px; border-radius: 8px; border: 1px solid var(--line); border-left-width: 6px; background: var(--panel); }
.fb.wrong { border-left-color: var(--bad); }
.fb.right { border-left-color: var(--good); }
.fb .h { font-weight: 700; display: block; margin-bottom: 4px; }
.fb.wrong .h { color: var(--bad); }
.fb.right .h { color: var(--good); }
.fb details { margin-top: 10px; }
.fb summary { cursor: pointer; font-weight: 700; color: var(--muted); }
.fb ul { margin: 8px 0 0; padding-left: 20px; font-size: 16px; }
.fb li { margin-bottom: 6px; }

.earned h2 { font-size: 38px; margin-bottom: 8px; }
.earned .fact { max-width: 56ch; margin-bottom: 16px; }

/* Results */
.results h2 { font-size: 44px; margin-bottom: 6px; }
.end-line { font-size: 20px; max-width: 56ch; margin-bottom: 18px; }
.stats { display: flex; gap: 28px; flex-wrap: wrap; margin: 0 0 20px; }
.stats div b { display: block; font-size: 34px; font-family: "Abril Fatface", Georgia, serif; font-weight: 400; line-height: 1.1; }
.stats div span { color: var(--muted); font-size: 15px; }
table { border-collapse: collapse; width: 100%; margin: 0 0 20px; font-size: 17px; }
th, td { text-align: left; padding: 10px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
th { font-size: 15px; color: var(--muted); }
.dots { white-space: nowrap; letter-spacing: 2px; color: var(--accent); }
.rv { font-weight: 700; }
.rv.s { color: var(--good); }
.rv.r { color: var(--bad); }
.ded { margin: 0 0 22px; max-width: 460px; }
.ded label { display: block; font-weight: 700; margin-bottom: 4px; }
.ded input { width: 100%; font: inherit; padding: 10px 12px; border-radius: 8px; border: 1px solid var(--line); background: var(--panel); color: var(--ink); }
textarea { width: 100%; min-height: 150px; font: inherit; font-size: 16px; padding: 10px; border-radius: 8px; border: 1px solid var(--line); background: var(--panel); color: var(--ink); margin-top: 10px; }
.note { color: var(--muted); font-size: 15px; }

.teacher { margin-top: 36px; border-top: 1px solid var(--line); padding-top: 8px; }
.teacher summary { cursor: pointer; font-weight: 700; color: var(--muted); }
.teacher table { font-size: 15px; margin-top: 10px; }
.teacher p, .teacher li { font-size: 16px; }
.teacher ul { padding-left: 20px; }

@media (max-width: 520px) {
  body { font-size: 17px; }
  .paper p { grid-template-columns: 3.6ch 1fr; }
  .paper.poem p { grid-template-columns: 5.6ch 1fr; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}
</style>
</head>
<body>
<div id="live" class="sr-only" aria-live="polite"></div>
<main class="wrap" id="app"></main>

<script>
/* ---------- Texts (all written for this game) ---------- */

const PASS = {
  A: {
    title: "What Is an Ofrenda?", kind: "An article written for this game",
    paras: [
      { n: "1", t: "Every year on November 1 and 2, families across Mexico and in many communities in the United States gather to remember loved ones who have died. This celebration, called Día de los Muertos, grew from the traditions of Indigenous peoples of what is now Mexico, such as the Mexica, who saw death as one stage in a long cycle of life. After the Spanish arrived, these customs blended with the Catholic observances of All Saints’ Day and All Souls’ Day, and the holiday known today took shape." },
      { n: "2", t: "At the heart of the celebration is the <i>ofrenda</i>, a home altar built to welcome the spirits of the departed. Families commemorate each person by arranging photographs, candles, and favorite foods, small tokens that keep the person’s memory alive. A bright path of <i>cempasúchil</i>, or marigold, petals leads from the front door to the altar. The flower’s strong scent and golden color are said to guide the spirits home." },
      { n: "3", t: "Each item on the ofrenda has a purpose. Candles light the way, water refreshes travelers who have come a long distance, and <i>pan de muerto</i>, a sweet bread decorated with strips of dough shaped like bones, feeds them. Above the altar, <i>papel picado</i>, tissue paper cut into delicate patterns, flutters in the slightest breeze. Its fragile beauty is a reminder that life is fleeting, here for a moment like paper in the wind." },
      { n: "4", t: "Although the holiday honors those who have died, it is not a gloomy occasion. Families share stories, laughter, and music, and children may eat sugar skulls with their own names written on them. By treating death as a natural part of life instead of something to fear, the celebration turns grief into gratitude." }
    ]
  },
  B: {
    title: "The Night the Candles Came Out", kind: "A story written for this game",
    paras: [
      { n: "1", t: "By six o’clock the kitchen smelled like cinnamon and orange peel, and the copal smoke curled toward the ceiling like a slow, gray ribbon." },
      { n: "2", t: "“Do not crush them,” Abuela said, nudging my hands as I scattered marigold petals from the back door to the table. “Each one is a little lantern for Tata.”" },
      { n: "3", t: "I had planned to stay quiet all night. Last year, the empty chair at the table had made my throat tight, and this year I wasn’t sure I could look at it. But Abuela had set out Tata’s chipped blue mug, a plate of his favorite tamales, and a photograph of him laughing, one hand holding a fishing line." },
      { n: "4", t: "“Tell me about the big fish,” I heard myself say." },
      { n: "5", t: "Abuela laughed, a sound as warm as the stove, and the story began. By the time she reached the part where Tata fell into the lake, my cousins had crowded in, and even Tío Rafa was wiping his eyes, grinning. The candles trembled as if they were laughing too." },
      { n: "6", t: "Later, when the house had gone quiet, I looked at the chair again. It still stood empty, but it no longer felt empty to me. The kitchen was full of him: in the stories, in the smell of the tamales, in the way Abuela hummed his favorite song while she washed the mug." }
    ]
  },
  C: {
    title: "Marigold Road", kind: "A poem written for this game", poem: true,
    stanzas: [
      ["Tonight the road begins at our front door,", "paved with petals the color of small suns.", "Every candle is a streetlamp", "for travelers who have come so far."],
      ["I am the keeper of the porch light.", "My job is to leave the gate unlatched,", "set the table for one more,", "and keep the road from going dark."],
      ["Abuela says the ones we miss are not lost.", "They are only far down the road,", "and love is the map they carry,", "folded small inside every story."],
      ["When morning comes, I will sweep the petals,", "but the road will stay.", "It runs through the kitchen, through the stories,", "all the way back to us."]
    ]
  },
  D: {
    title: "Día de los Muertos Deserves Its Own Lesson", kind: "An editorial written for this game",
    paras: [
      { n: "1", t: "Every October, school hallways fill with paper skeletons and cartoon ghosts, and somewhere in the mix, a sugar skull gets taped up beside a plastic pumpkin. Teachers mean well. But treating Día de los Muertos as a spooky cousin of Halloween is a mistake. Schools should teach it as its own celebration, with its own history and meaning." },
      { n: "2", t: "The two holidays have different purposes. Halloween plays with fear; Día de los Muertos is about love and memory. Families build ofrendas not to scare anyone, but to welcome home relatives they miss, using photographs, favorite foods, and marigolds." },
      { n: "3", t: "Some argue that the holidays look alike because both feature skulls and skeletons, so teaching them together saves time. But a skull on a Halloween porch is meant to frighten, while a <i>calavera</i> on an ofrenda is a playful reminder that death is part of life. Looking alike is not the same as meaning the same." },
      { n: "4", t: "There is also a matter of respect. Millions of families observe this holiday as a deeply personal tradition. When a school folds it into a Halloween display, students whose families celebrate it may feel that their traditions are being treated as decoration." },
      { n: "5", t: "Teaching the holiday on its own terms takes little extra effort: one lesson on its history, another on the ofrenda. The reward is that every student learns what the holiday actually celebrates. The next time a skull goes up on a school wall, it should come with the story behind it." }
    ]
  }
};

const ITEMS = {
  marigold: { short: "Marigolds", name: "Cempasúchil (marigolds)", fact: "Marigolds are the flower of the season. Their strong scent and golden color are said to guide spirits home along a path of petals." },
  pan:      { short: "Pan de muerto", name: "Pan de muerto", fact: "This sweet bread, decorated with strips of dough shaped like bones, is shared by families and placed on the ofrenda as an offering." },
  photo:    { short: "Photograph", name: "A photograph", fact: "Photographs of loved ones are placed on the ofrenda so each person is remembered by name and face." },
  candles:  { short: "Candles", name: "Candles", fact: "Candles light the way for returning spirits. In some homes, each candle stands for a person being remembered." },
  papel:    { short: "Papel picado", name: "Papel picado", fact: "Tissue paper cut into delicate patterns flutters above the altar. It is a reminder that life is fleeting." },
  skull:    { short: "Calavera", name: "Calavera (sugar skull)", fact: "Colorful sugar skulls are playful and joyful, and some carry a name. They celebrate life rather than frighten." }
};

/* ---------- Questions ---------- */

const SETS = [
  {
    teks: "8.2B", teksText: "Use context within or beyond a paragraph to clarify the meaning of unfamiliar or ambiguous words.",
    name: "Words on the Altar", pass: "A", item: "marigold",
    intro: "Unfamiliar words can hide in any paragraph. Use the clues around them to place the marigolds on your ofrenda.",
    qs: [
      {
        type: "single",
        focus: { label: "Paragraph 2 (part)", paras: [{ n: "2", t: "Families <b>commemorate</b> each person by arranging photographs, candles, and favorite foods, small tokens that keep the person’s memory alive." }] },
        prompt: "What does the word <em>commemorate</em> most likely mean?",
        opts: [
          { t: "Honor and keep alive the memory of", ok: true },
          { t: "Forget or move on from", why: "The same sentence says the items “keep the person’s memory alive,” so the word cannot mean forget." },
          { t: "Argue with", why: "Arranging photographs and favorite foods is a loving act, not an argument." },
          { t: "Replace with something new", why: "The items are chosen because the person loved them. Nothing is being replaced." }
        ],
        clue: "Look at what the “small tokens” do: they “keep the person’s memory alive.”",
        explain: "Photographs, candles, and favorite foods are arranged to honor each person and keep the memory alive."
      },
      {
        type: "single",
        focus: { label: "Paragraph 2 (part)", paras: [{ n: "2", t: "…a home altar built to welcome the <b>spirits</b> of the departed. … The flower’s strong scent and golden color are said to guide the <b>spirits</b> home." }] },
        prompt: "The word <em>spirits</em> has several meanings. Which meaning fits here?",
        opts: [
          { t: "Souls of people who have died", ok: true },
          { t: "Moods or feelings, as in “in high spirits”", why: "Moods cannot be “welcomed” or “guided home” along a path of petals. The word refers to beings who travel." },
          { t: "Strong drinks", why: "The offerings listed are food and water, and nothing here is about drinks." },
          { t: "Courage or determination", why: "The spirits are guided home, so the word names who is traveling, not a quality they have." }
        ],
        clue: "Who or what is being “welcomed” and “guided home” along a path of petals?",
        explain: "“Spirits of the departed” tells you the word means the souls of people who have died."
      },
      {
        type: "single",
        focus: { label: "Paragraph 3 (part)", paras: [{ n: "3", t: "Its fragile beauty is a reminder that life is <b>fleeting</b>, here for a moment like paper in the wind." }] },
        prompt: "What does the word <em>fleeting</em> most likely mean?",
        opts: [
          { t: "Lasting only a short time", ok: true },
          { t: "Hard to see", why: "The comparison is about how long something lasts, not whether it can be seen." },
          { t: "Valuable and rare", why: "“Here for a moment” points to time, not value." },
          { t: "Easy to repair", why: "Nothing in the sentence is about fixing anything. “Fragile” and “for a moment” are the clues." }
        ],
        clue: "Look at the comparison at the end of the sentence: “here for a moment like paper in the wind.”",
        explain: "Paper in the wind is here only briefly. That is the idea of “fleeting.”"
      }
    ]
  },
  {
    teks: "8.6D", teksText: "Paraphrase and summarize texts in ways that maintain meaning and logical order.",
    name: "Say It in Your Own Words", pass: "A", item: "pan",
    intro: "Restating an idea keeps its meaning and its order. Get it right to bake the pan de muerto.",
    qs: [
      {
        type: "single",
        focus: { label: "Paragraph 1 (part)", paras: [{ n: "1", t: "Every year on November 1 and 2, families across Mexico and in many communities in the United States gather to remember loved ones who have died." }] },
        prompt: "Which sentence is the best paraphrase?",
        opts: [
          { t: "Each November 1 and 2, families in Mexico and many U.S. communities come together to remember relatives who have passed away.", ok: true },
          { t: "Families in Mexico and the United States gather every day in November to mourn.", why: "This changes the meaning: the original names two days, and it is about remembering, not only mourning." },
          { t: "Every year, only families in Mexico gather to remember loved ones.", why: "This leaves out the United States communities the original includes." },
          { t: "Every November, families gather to celebrate the Spanish arrival in Mexico.", why: "This adds an idea that is not in the sentence." }
        ],
        clue: "A good paraphrase keeps the same facts: which days, which places, and what families do.",
        explain: "It keeps the dates, the places, and the purpose, using different words."
      },
      {
        type: "single",
        focus: { label: "Paragraph 4 (last sentence)", paras: [{ n: "4", t: "By treating death as a natural part of life instead of something to fear, the celebration turns grief into gratitude." }] },
        prompt: "Which sentence is the best paraphrase?",
        opts: [
          { t: "The holiday helps people feel thankful, not only sad, by seeing death as part of life instead of something frightening.", ok: true },
          { t: "The celebration makes sure no one feels sad about death.", why: "This overstates the idea. The original says grief turns into gratitude, not that sadness disappears." },
          { t: "Because people fear death, the celebration asks them to avoid thinking about it.", why: "This is the opposite of the original, which says the holiday faces death openly." },
          { t: "The holiday teaches that gratitude is more important than remembering the dead.", why: "This changes the meaning. Remembering the dead is the whole point of the holiday." }
        ],
        clue: "Check the cause and the effect in the original: what is the holiday doing, and what happens to grief?",
        explain: "It keeps both the cause (treating death as natural) and the effect (grief becomes gratitude)."
      },
      {
        type: "single",
        focus: null,
        prompt: "Which summary best keeps the meaning and logical order of the whole article?",

function shuffle(a) { const b = a.slice(); for (let i = b.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [b[i], b[j]] = [b[j], b[i]]; } return b; }
const key = (s, q) => s + "-" + q;

function resetGame() {
  Object.assign(S, {

    status: null, msg: "", passOpen: true, showBox: false
  });
  SETS.forEach((st, si) => st.qs.forEach((q, qi) => { S.order[key(si, qi)] = shuffle(q.opts.map((_, i) => i)); }));
}
const cur = () => SETS[S.s].qs[S.q];
function say(t) { $live.textContent = ""; setTimeout(() => { $live.textContent = t; }, 40); }
function strip(h) { const d = document.createElement("div"); d.innerHTML = h; return d.textContent; }

function pills() {

function topBar() {
  return `<div class="top"><div class="brand">La Ofrenda</div><ul class="pills" aria-label="${S.earned.length} of 6 pieces placed">${pills()}</ul></div>`;
}

function teacherNotes() {
  const rows = SETS.map(st => `<tr><td>${st.teks}</td><td>${st.name}</td><td>${PASS[st.pass].title}</td><td>${st.qs.length}</td></tr>`).join("");
  return `<details class="teacher">
    <summary>Teacher notes</summary>
    <table><thead><tr><th>TEKS</th><th>Stop</th><th>Text</th><th>Questions</th></tr></thead><tbody>${rows}</tbody></table>
    <ul>
      <li><b>Texts.</b> All four texts (an article, a story, a poem, and an editorial) were written for this game. They summarize widely shared Día de los Muertos traditions. Practices vary by region and family, so invite students to share what their own families do, including local Rio Grande Valley traditions.</li>
      <li><b>Care.</b> Some students may have lost someone recently. The game treats remembering with warmth, and the dedication on the last screen is optional and stays on the student’s screen.</li>
      <li><b>8.8Ei.</b> The editorial is argumentative: its claim is that schools should teach Día de los Muertos as its own celebration rather than as part of Halloween. A good follow-up is a class discussion of the counterargument in paragraph 3.</li>
      <li><b>8.9D.</b> “Marigold Road” extends one metaphor (the ofrenda as a road home) across all four stanzas.</li>
      <li><b>Scoring.</b> 3 points for a first-try answer, 2 for a second, 1 after that (${TOTAL_Q * 3} possible). Each student has three velas (clues or cross-outs) for the whole game, tracked in the results.</li>
      <li><b>Privacy.</b> The game asks for no names and stores or sends nothing. Results live on the student’s screen and can be copied as plain text.</li>
      <li><b>Timing.</b> About 30 to 35 minutes.</li>
    </ul>
  </details>`;
}

function viewStart() {
  return `<section class="hero">
    <h1 data-focus tabindex="-1">La Ofrenda</h1>
    <p class="tag">A Día de los Muertos reading game. Build an altar, one piece at a time.</p>
    ${altarBox([], null, false)}
    <p class="recap"><b>How it works.</b> You will read four short texts about Día de los Muertos: an article, a story, a poem, and an editorial. Each time you finish a set of questions, a piece appears on your <i>ofrenda</i> (an altar built to remember loved ones). Place all six to complete it.</p>
    <p class="recap">You have three <b>velas</b> (candles) for the whole game. Light one to get a clue or to cross out two wrong answers, and save them for the hard questions.</p>
    <button class="btn" data-act="start">Begin</button>
  </section>
  ${teacherNotes()}`;
}

function renderPass(P) {
  if (P.poem) {
    const rows = P.stanzas.map((st, i) => `<p><span class="pn">St. ${i + 1}</span><span>${st.join("<br>")}</span></p>`).join("");
    return `<figure class="paper poem" style="margin-left:12px;margin-right:12px">${rows}</figure>`;
  }
  const rows = P.paras.map(x => `<p><span class="pn">¶${x.n}</span><span>${x.t}</span></p>`).join("");
  return `<figure class="paper" style="margin-left:12px;margin-right:12px">${rows}</figure>`;
}
function focusHTML(f) {
  if (!f) return "";
  const rows = f.paras.map(x => `<p><span class="pn">${/^St/.test(x.n) ? x.n : "¶" + x.n}</span><span>${x.t}</span></p>`).join("");
  return `<figure class="paper${/St/.test(f.paras[0].n) ? " poem" : ""}" style="margin-left:0;margin-right:0"><figcaption>${f.label}</figcaption>${rows}</figure>`;
}
function velaDots() {
  let s = ""; for (let i = 0; i < 3; i++) s += `<span class="vela${i < S.velas ? " full" : ""}"></span>`;
  return `<span class="velas" aria-label="${S.velas} of 3 velas left">${s}</span>`;
}

function viewPlay() {
  const st = SETS[S.s], q = cur(), k = key(S.s, S.q), solved = S.status === "right";
  const P = PASS[st.pass];
  const type = q.type === "multi" ? "checkbox" : "radio";

  const opts = S.order[k].map(i => {
    const o = q.opts[i];
    const out = S.crossed.includes(i) || S.wrongOpts.includes(i);
    const dis = out || solved;
    const cls = "choice" + (out ? " out" : "") + (solved && o.ok ? " right" : "");
    const tag = S.crossed.includes(i) ? `<span class="tag">Crossed out by your vela</span>` : S.wrongOpts.includes(i) ? `<span class="tag">Ruled out</span>` : solved && o.ok ? `<span class="tag">Correct</span>` : "";
    return `<label class="${cls}"><input type="${type}" name="ans" value="${i}" ${S.sel.includes(i) ? "checked" : ""} ${dis ? "disabled" : ""}><span class="t">${o.t}${tag}</span></label>`;
  }).join("");

  let fb = "";
  if (S.status === "wrong") fb = `<div class="fb wrong" tabindex="-1" data-fb><span class="h">Not quite</span>${S.msg}</div>`;
  else if (solved) {
    const pts = Math.max(1, 4 - S.attempts[k]);
    const why = q.opts.filter(o => !o.ok).map(o => `<li><b>${strip(o.t)}</b> ${o.why}</li>`).join("");
    fb = `<div class="fb right" tabindex="-1" data-fb><span class="h">Correct. +${pts} ${pts === 1 ? "point" : "points"}</span>${q.explain}
      <details><summary>Why the other choices don’t work</summary><ul>${why}</ul></details></div>`;
  }

  const menu = S.menu && !solved ? `<div class="menu"><p>Lighting a vela costs one of your three. Pick one.</p>
      <div class="row"><button class="btn ghost" data-act="clue" ${S.clue ? "disabled" : ""}>Show a clue</button>
      <button class="btn ghost" data-act="cross" ${S.crossedUsed ? "disabled" : ""}>Cross out two wrong answers</button></div></div>` : "";
  const clue = S.clue ? `<div class="clue"><b>Clue.</b> ${q.clue}</div>` : "";
  const last = S.q === st.qs.length - 1;
  const need = q.type === "multi" ? q.need : 1;
  const controls = solved
    ? `<div class="row actions"><button class="btn" data-act="next">${last ? "Place it on the ofrenda" : "Next question"}</button></div>`
    : `<div class="row actions"><button class="btn" data-act="check" id="checkBtn" ${S.sel.length === need ? "" : "disabled"}>Check answer</button>
       <button class="btn ghost" data-act="menu" ${S.velas < 1 ? "disabled" : ""}>Use a vela</button></div>`;

  return `${topBar()}
  <section>
    <header class="set-head">
      <h2 data-focus tabindex="-1">${st.name}</h2>
      <p class="skill">${st.intro}</p>
      <div class="teks"><b>${st.teks}</b><span>${st.teksText}</span></div>
    </header>
    <details class="peek"><summary>My ofrenda: ${S.earned.length} of 6 pieces</summary>${altarBox(S.earned, null, false)}</details>
    <details class="passage" ${S.passOpen ? "open" : ""}><summary>${P.title}<span class="kind">${P.kind}. Tap to show or hide.</span></summary>${renderPass(P)}</details>
    <div class="qmeta"><span>Question ${S.q + 1} of ${st.qs.length}</span><span>Velas left ${velaDots()}</span></div>
    ${focusHTML(q.focus)}
    <fieldset style="border:0;padding:0;margin:0">
      <legend class="prompt">${q.prompt}</legend>
      ${q.hint ? `<p class="hint">${q.hint}</p>` : ""}
      ${opts}
    </fieldset>
    ${controls}${menu}${clue}${fb}
  </section>`;
}

function viewEarned() {
  const st = SETS[S.s], it = ITEMS[st.item];
  let n = 0; st.qs.forEach((_, qi) => { if (S.first[key(S.s, qi)]) n++; });
  const last = S.s === SETS.length - 1;
  return `${topBar()}
  <section class="earned">
    <h2 data-focus tabindex="-1">${it.name}</h2>
    <p class="fact">${it.fact}</p>
    ${altarBox(S.earned, S.newItem, false)}
    <p>You answered ${n} of ${st.qs.length} questions correctly on the first try in this set. ${last ? "That is the last piece." : "Next: " + SETS[S.s + 1].name + "."}</p>
    <button class="btn" data-act="advance">${last ? "See my finished ofrenda" : "Continue"}</button>
  </section>`;
}

const firstIn = si => SETS[si].qs.reduce((a, _, qi) => a + (S.first[key(si, qi)] ? 1 : 0), 0);
const firstTotal = () => SETS.reduce((a, _, i) => a + firstIn(i), 0);
function resultsText() {
  const L = ["La Ofrenda: results", `Points: ${S.pts} / ${TOTAL_Q * 3}`, `First-try correct: ${firstTotal()} / ${TOTAL_Q}`, `Velas used: ${S.used} / 3`, ""];
  SETS.forEach((st, i) => L.push(`${st.teks} ${st.name}: ${firstIn(i)}/${st.qs.length} on the first try`));
  return L.join("\n");
}

function viewEnd() {
  const max = TOTAL_Q * 3, pct = S.pts / max;
  const line = pct >= 0.8 ? "Your ofrenda is full of light. You read closely, and every piece is in its place."
    : pct >= 0.55 ? "Your ofrenda is complete, though a few candles still flicker. Check the skills marked “Revisit” below."
    : "Your ofrenda is complete. Talk with your teacher about the skills marked “Revisit,” then play again to strengthen them.";
  const rows = SETS.map((st, i) => {
    const f = firstIn(i), n = st.qs.length;
    const lab = f === n ? ["Strong", "s"] : f === n - 1 ? ["Solid", "s"] : ["Revisit", "r"];
    return `<tr><td>${st.teks}</td><td>${st.name}</td><td class="dots" aria-label="${f} of ${n} on first try">${"●".repeat(f)}${"○".repeat(n - f)}</td><td class="rv ${lab[1]}">${lab[0]}</td></tr>`;
  }).join("");
  return `${topBar()}
  <section class="results">
    <h2 data-focus tabindex="-1">Your ofrenda is ready</h2>
    <p class="end-line">${line}</p>
    ${altarBox(S.earned, null, true)}
    <div class="ded">
      <label for="ded">Optional: dedicate your ofrenda</label>
      <input id="ded" type="text" maxlength="60" placeholder="A word or short line for someone you remember" value="${S.ded.replace(/"/g, "&quot;")}">
      <p class="note" style="margin-top:6px">You can skip this. Whatever you type stays on your screen and is not saved.</p>
    </div>
    <div class="stats">
      <div><b>${S.pts} / ${max}</b><span>points</span></div>
      <div><b>${firstTotal()} / ${TOTAL_Q}</b><span>correct on the first try</span></div>
      <div><b>${S.used} / 3</b><span>velas used</span></div>
    </div>
    <table><thead><tr><th>TEKS</th><th>Skill</th><th>First try</th><th>Next step</th></tr></thead><tbody>${rows}</tbody></table>
    <div class="row">
      <button class="btn" data-act="copy">Copy my results</button>
      <button class="btn ghost" data-act="again">Play again</button>
    </div>
    ${S.showBox ? `<p class="note" style="margin-top:12px">Your browser blocked copying. Select the text below and copy it yourself.</p><textarea readonly id="resBox">${resultsText()}</textarea>` : ""}
    <p class="note" style="margin-top:14px">Results show on this screen only. Nothing is saved or sent anywhere.</p>
  </section>
  ${teacherNotes()}`;
}

/* ---------- Render and events ---------- */

function render(focus) {
  $app.innerHTML = S.screen === "start" ? viewStart() : S.screen === "play" ? viewPlay() : S.screen === "earned" ? viewEarned() : viewEnd();
  if (S.screen === "end") { const c = document.getElementById("dedCap"); if (c) c.textContent = S.ded; }
  if (focus) { const el = $app.querySelector(focus); if (el) el.focus(); }
}
function resetQuestionUI() { S.sel = []; S.crossed = []; S.wrongOpts = []; S.clue = false; S.menu = false; S.crossedUsed = false; S.status = null; S.msg = ""; }
function spendVela() { S.velas -= 1; S.used += 1; }

function check() {
  const q = cur(), k = key(S.s, S.q), need = q.type === "multi" ? q.need : 1;
  if (S.sel.length !== need) return;
  S.attempts[k] = (S.attempts[k] || 0) + 1;
  const chosen = S.sel.slice();
  const okCount = chosen.filter(i => q.opts[i].ok).length;
  S.menu = false;
  if (okCount === need) {
    S.status = "right"; S.pts += Math.max(1, 4 - S.attempts[k]); S.first[k] = S.attempts[k] === 1;
    say("Correct."); render("[data-fb]");
  } else {
    S.status = "wrong";
    if (q.type === "single") { S.wrongOpts.push(chosen[0]); S.msg = q.opts[chosen[0]].why + " Try another choice."; }
    else S.msg = `You have ${okCount} of ${need} right. Reread the details and swap one.`;
    S.sel = []; say("Not quite."); render("[data-fb]");
  }
}

$app.addEventListener("change", e => {
  if (!e.target.matches('input[name="ans"]')) return;
  const q = cur(), i = Number(e.target.value);
  if (q.type === "single") S.sel = [i];
  else S.sel = e.target.checked ? S.sel.concat(i) : S.sel.filter(x => x !== i);
  const b = document.getElementById("checkBtn");
  if (b) b.disabled = S.sel.length !== (q.type === "multi" ? q.need : 1);
});
$app.addEventListener("input", e => {
  if (e.target.id === "ded") { S.ded = e.target.value; const c = document.getElementById("dedCap"); if (c) c.textContent = S.ded; }
});
$app.addEventListener("toggle", e => { if (e.target.matches && e.target.matches("details.passage")) S.passOpen = e.target.open; }, true);

$app.addEventListener("click", e => {
  const b = e.target.closest("[data-act]");
  if (!b || b.disabled) return;
  const act = b.dataset.act;
  if (act === "start") { S.screen = "play"; resetQuestionUI(); S.passOpen = true; render("[data-focus]"); }
  else if (act === "check") check();
  else if (act === "menu") { S.menu = !S.menu; render(); }
  else if (act === "clue") { if (S.velas < 1 || S.clue) return; spendVela(); S.clue = true; S.menu = false; render(); say("Clue shown."); }
  else if (act === "cross") {
    if (S.velas < 1 || S.crossedUsed) return;
    const q = cur();
    const pool = q.opts.map((o, i) => i).filter(i => !q.opts[i].ok && !S.wrongOpts.includes(i) && !S.crossed.includes(i));
    const pick = shuffle(pool).slice(0, 2);
    spendVela(); S.crossed = S.crossed.concat(pick); S.crossedUsed = true; S.menu = false; S.sel = S.sel.filter(i => !pick.includes(i));
    render(); say("Two wrong answers crossed out.");
  }
  else if (act === "next") {
    const st = SETS[S.s];
    if (S.q < st.qs.length - 1) { S.q += 1; resetQuestionUI(); render("[data-focus]"); window.scrollTo(0, 0); }
    else {
      if (!S.earned.includes(st.item)) S.earned.push(st.item);
      S.newItem = st.item; S.screen = "earned"; render("[data-focus]"); window.scrollTo(0, 0);
      say(ITEMS[st.item].name + " added to your ofrenda.");
    }
  }
  else if (act === "advance") {
    S.newItem = null;
    if (S.s < SETS.length - 1) { S.s += 1; S.q = 0; S.screen = "play"; resetQuestionUI(); S.passOpen = true; }
    else S.screen = "end";
    render("[data-focus]"); window.scrollTo(0, 0);
  }
  else if (act === "copy") {
    const txt = resultsText();
    const fallback = () => { S.showBox = true; render(); const t = document.getElementById("resBox"); if (t) { t.focus(); t.select(); } };
    try {
      if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(txt).then(() => { b.textContent = "Copied"; say("Results copied."); }, fallback);
      else fallback();
    } catch (err) { fallback(); }
  }
  else if (act === "again") { resetGame(); render("[data-focus]"); window.scrollTo(0, 0); }
});

resetGame();
render();
</script>
</body>
</html>
